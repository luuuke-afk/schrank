<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schrank">
<meta name="theme-color" content="#E8EBEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Schrank</title>
<style>
:root{--bg:#E8EBEE;--surface:#F6F7F9;--ink:#1B2430;--muted:#65707E;--line:#CDD3DA;--accent:#2B3FD6;--accent-ink:#fff;--danger:#B3261E;--panel:#F8F9FB;--panel2:#E4E8ED}
@media (prefers-color-scheme:dark){:root{--bg:#12151C;--surface:#1B202A;--ink:#EDEFF4;--muted:#9099A8;--line:#2D3440;--accent:#8C9BFF;--accent-ink:#0E1220;--danger:#FF8A80;--panel:#2A3140;--panel2:#1D232D}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 4px}
h1,h2,h3{font-family:ui-serif,"New York",Georgia,serif;margin:0}
h1{font-size:38px;line-height:1.05;font-weight:600;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:14px}
.lnk{color:var(--accent);font-weight:600;padding:8px 0 8px 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 12px;padding:10px 18px 150px}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{display:flex;flex-direction:column;text-align:left;min-width:0}
.nm{font-weight:600;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:14px}
.empty{grid-column:1/-1;color:var(--muted);padding:28px 2px;max-width:34ch}
.collage{display:grid;gap:2px;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--line);place-items:center}
.collage.n1{grid-template-columns:1fr}
.collage.n2{grid-template-columns:1fr 1fr}
.collage.n3,.collage.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.collage.n3>:first-child{grid-row:span 2}
.collage.n0::after{content:"Noch leer";color:var(--muted);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;color:var(--muted);font-size:12px}
.tab.on{color:var(--accent)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);padding:14px 22px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 6px 18px rgba(20,30,90,.28)}
dialog{border:0;padding:0;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;margin:auto auto 0;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,24,.5)}
.sheet{padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:14px}
h2{font-size:26px;line-height:1.1;font-weight:600}
h3{font-size:17px;font-weight:600;margin:10px 0 6px}
label.f{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14px}
input[type=text],select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.btn{position:relative;padding:14px;border-radius:14px;font-weight:600;border:1px solid var(--line);text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--danger)}
.photo{background:var(--panel);position:relative;display:grid;place-items:center;aspect-ratio:4/3;border-radius:14px;border:1.5px dashed var(--line);overflow:hidden;color:var(--muted);text-align:center;padding:0 20px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.photo small{display:block;margin-top:4px;font-size:12px}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.top{display:flex;gap:14px;align-items:flex-start}
.ccol{width:34%;flex:none}
.side{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.pick{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.pk{position:relative;flex:none;width:84px}
.pk.on::after{content:"✓";position:absolute;inset:0;border-radius:10px;border:3px solid var(--accent);background:rgba(43,63,214,.2);color:var(--accent-ink);font-weight:700;display:flex;justify-content:flex-end;align-items:flex-start;padding:3px 7px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:99;width:max-content;max-width:86%;text-align:center;font-size:15px}
.th{display:block;position:relative;width:100%;aspect-ratio:3/4;background:radial-gradient(120% 90% at 50% 30%,var(--panel),var(--panel2));border-radius:10px;overflow:hidden}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.th.cut img{inset:10%;width:80%;height:80%;filter:drop-shadow(0 4px 6px rgba(30,40,60,.28))}
.collage{grid-auto-rows:1fr}
.collage .th{height:100%;aspect-ratio:auto;border-radius:0}
.collage.m{grid-template-columns:repeat(3,1fr)}
.chips.tight{padding:0;flex-wrap:wrap;overflow:visible}
.wk{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 0}
.wkt{text-align:center}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);font-size:26px;line-height:1;color:var(--accent)}
.days{padding:14px 18px 150px}
.day{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 12px;margin-bottom:8px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.day.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.dl{flex:none;width:44px;text-align:center;line-height:1.25;color:var(--muted)}
.dl b{display:block;color:var(--ink);font:600 18px ui-serif,Georgia,serif}
.dc{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dc .nm{margin-top:0}
.strip{display:flex;gap:4px}
.strip .th{width:40px;flex:none;border-radius:6px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.ovcol{width:58%;margin:0 auto}
.irow{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.irow .th{width:52px;flex:none;border-radius:8px}
.irow .nm{margin-top:0}
.card{position:relative}
.star{position:absolute;top:6px;right:6px;z-index:2;width:34px;height:34px;display:grid;place-items:center;font-size:20px;line-height:1;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.star.on{color:var(--accent)}
.chk{display:flex;gap:10px;align-items:center;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.busy{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:0 20px;background:var(--panel);color:var(--ink);text-align:center}
.banner{display:flex;flex-direction:column;gap:10px;margin:10px 18px 0;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--accent);font-size:15px}
.banner .btn{padding:10px}
</style>
</head>
<body>
<header>
  <div><h1 id="title">Bestand</h1><div class="meta" id="count"></div></div>
  <button class="lnk" id="bkBtn">Backup</button>
</header>
<div class="banner" id="bkBanner" hidden><span id="bkTxt"></span><div class="row"><button class="btn pri" id="bkNow">Jetzt sichern</button><button class="btn" id="bkLater">Später</button></div></div>
<main>
  <section id="v-items">
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </section>
  <section id="v-outfits" hidden>
    <div class="chips" id="ochips"></div>
    <div class="grid" id="ogrid"></div>
  </section>
  <section id="v-week" hidden>
    <div class="wk">
      <button class="nav" id="wPrev" aria-label="Vorherige Woche">‹</button>
      <div class="wkt"><div class="nm" id="wTitle"></div><div class="sub" id="wRange"></div></div>
      <button class="nav" id="wNext" aria-label="Nächste Woche">›</button>
    </div>
    <div class="days" id="days"></div>
  </section>
</main>
<button class="fab" id="fab"></button>
<nav class="tabs">
  <button class="tab on" data-t="items"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Bestand</button>
  <button class="tab" data-t="outfits"><svg viewBox="0 0 24 24"><path d="M12 10V9a2.5 2.5 0 1 0-2.5-2.5"/><path d="M12 10 3.5 16a1 1 0 0 0 .6 1.8h15.8a1 1 0 0 0 .6-1.8L12 10Z"/></svg>Outfits</button>
<button class="tab" data-t="week"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>Woche</button>
</nav>

<dialog id="itemDlg"><div class="sheet">
  <h2 id="itTitle"></h2>
  <label class="photo"><input class="vh" type="file" accept="image/*" id="photoIn"><img id="photoPrev" alt="" hidden><span class="busy" id="photoBusy" hidden></span><span id="photoHint">Foto aufnehmen oder auswählen</span></label>
  <label class="chk"><input type="checkbox" id="autoCut" checked>Hintergrund automatisch entfernen</label>
  <label class="f">Name<input type="text" id="itName" placeholder="z. B. Weißes Oxford-Hemd" autocomplete="off"></label>
  <div class="row">
    <label class="f">Kategorie<select id="itCat"></select></label>
    <label class="f">Farbe<select id="itColor"></select></label>
  </div>
  <div class="row"><button class="btn" id="itCancel">Abbrechen</button><button class="btn pri" id="itSave">Speichern</button></div>
  <button class="btn dng" id="itDel" hidden>Teil löschen</button>
</div></dialog>

<dialog id="outfitDlg"><div class="sheet">
  <h2 id="ouTitle"></h2>
  <div class="top">
    <div class="ccol" id="ouCol"></div>
    <div class="side">
      <label class="f">Name (optional)<input type="text" id="ouName" placeholder="Sonst automatisch" autocomplete="off"></label>
      <div class="meta" id="ouCount"></div>
    </div>
  </div>
  <div><h3>Kategorie</h3><div class="chips tight" id="ouCats"></div></div>
  <div id="picker"></div>
  <div class="row"><button class="btn" id="ouCancel">Abbrechen</button><button class="btn pri" id="ouSave">Speichern</button></div>
</div></dialog>

<dialog id="ovDlg"><div class="sheet">
  <div><h2 id="ovTitle"></h2><div class="meta" id="ovMeta"></div></div>
  <div class="ovcol" id="ovCol"></div>
  <div id="ovItems"></div>
  <div><h3 id="ovWk"></h3><div class="chips tight" id="ovDays"></div></div>
  <div class="row"><button class="btn pri" id="ovEdit">Bearbeiten</button><button class="btn dng" id="ovDel">Löschen</button></div>
  <button class="btn" id="ovClose">Schließen</button>
</div></dialog>

<dialog id="dayDlg"><div class="sheet">
  <h2 id="dyTitle"></h2>
  <div id="dyList"></div>
  <button class="btn" id="dyClear">Kein Outfit</button>
  <button class="btn" id="dyClose">Schließen</button>
</div></dialog>

<dialog id="bkDlg"><div class="sheet">
  <h2>Backup</h2>
  <p class="meta" style="margin:0">Deine Daten liegen nur auf diesem iPhone. Sichere sie regelmäßig als Datei, zum Beispiel in iCloud Drive.</p>
  <div class="meta" id="bkInfo"></div>
  <button class="btn pri" id="exp">Daten exportieren</button>
  <label class="btn">Daten importieren<input class="vh" type="file" accept="application/json,.json" id="impIn"></label>
  <button class="btn" id="bkClose">Schließen</button>
</div></dialog>

<script>
(()=>{
const CATS=['Oberteile','Hosen','Jacken','Schuhe','Accessoires','Uhren'];
const COLORS=['Schwarz','Weiß','Grau','Beige','Braun','Blau','Grün','Rot','Gelb','Rosa','Mehrfarbig'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;
const OCATS=['Alltag','Arbeit','Ausgehen','Festlich','Sport'],ONE=['Hosen','Schuhe','Uhren'],ORDER=['Jacken','Oberteile','Hosen','Schuhe','Accessoires','Uhren'],WD=['Mo','Di','Mi','Do','Fr','Sa','So'],MON=['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sep.','Okt.','Nov.','Dez.'];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const mondayOf=d=>addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-((d.getDay()+6)%7));
const weekDates=m=>[0,1,2,3,4,5,6].map(n=>iso(addDays(m,n)));
const kw=m=>{const t=addDays(m,3),j=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-j)/864e5-3+(j.getDay()+6)%7)/7);};
let db,items=[],outfits=[],plan={},tab='items',filter='Alle',ofilter='Alle',ocat='Alltag',cur=null,curO=null,photo=null,photoCut=false,sel=new Set(),weekStart=mondayOf(new Date()),dayD=null,busy=false;

/* Speicher (IndexedDB) */
const openDb=()=>new Promise((res,rej)=>{const r=indexedDB.open('schrank',2);r.onupgradeneeded=()=>{const d=r.result;['items','outfits'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});if(!d.objectStoreNames.contains('plan'))d.createObjectStore('plan',{keyPath:'date'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const tx=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m);const o=f(t.objectStore(s));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error);});
const all=s=>tx(s,'readonly',o=>o.getAll());
const put=(s,v)=>tx(s,'readwrite',o=>o.put(v));
const rm=(s,id)=>tx(s,'readwrite',o=>o.delete(id));
async function save(s,v){try{await put(s,v);return true;}catch(e){toast('Speichern fehlgeschlagen. Ist noch Platz auf dem iPhone?');return false;}}
const sortAll=()=>{items.sort((a,b)=>b.created-a.created);outfits.sort((a,b)=>b.created-a.created);};

/* Hilfen */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;(document.querySelector('dialog[open]')||document.body).append(t);setTimeout(()=>t.remove(),2800);}
const byId=id=>items.find(i=>i.id===id);
const sortIds=ids=>ids.filter(byId).sort((a,b)=>ORDER.indexOf(byId(a).cat)-ORDER.indexOf(byId(b).cat));
const thumb=i=>`<span class="th${i.cut?' cut':''}">${i.img?`<img src="${i.img}" alt="${esc(i.name)}">`:''}</span>`;
const collage=ids=>{const l=sortIds(ids).slice(0,9).map(byId);return `<div class="collage ${l.length>4?'m':'n'+l.length}">${l.map(thumb).join('')}</div>`;};
const fileToImg=f=>new Promise((res,rej)=>{const u=URL.createObjectURL(f);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i);};i.onerror=rej;i.src=u;});
const ls={get:k=>{try{return localStorage.getItem('schrank.'+k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem('schrank.'+k,v);}catch(e){}}};
const star=o=>`<span class="star${o.fav?' on':''}" data-fav="${o.id}" role="button" aria-label="Favorit">${o.fav?'★':'☆'}</span>`;
const setBusy=m=>{const b=$('#photoBusy');b.textContent=m;b.hidden=!m;};
$('#autoCut').checked=ls.get('autocut')!=='0';
$('#autoCut').onchange=()=>ls.set('autocut',$('#autoCut').checked?'1':'0');
let seg=null;
async function loadSeg(){
  if(seg)return seg;
  setBusy('Modell wird geladen, einmalig ca. 45 MB …');
  const T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1');
  T.env.allowLocalModels=false;
  const progress_callback=p=>{if(p.status==='progress'&&p.total>1e6)setBusy(`Modell wird geladen, ${Math.round(p.progress)} % (einmalig)`);};
  const model=await T.AutoModel.from_pretrained('briaai/RMBG-1.4',{config:{model_type:'custom'},dtype:'q8',progress_callback});
  const processor=await T.AutoProcessor.from_pretrained('briaai/RMBG-1.4',{config:{do_normalize:true,do_pad:false,do_rescale:true,do_resize:true,image_mean:[0.5,0.5,0.5],feature_extractor_type:'ImageFeatureExtractor',image_std:[1,1,1],resample:2,rescale_factor:0.00392156862745098,size:{width:1024,height:1024}}});
  return seg={T,model,processor};
}
async function removeBg(c){
  const S=await loadSeg();
  setBusy('Hintergrund wird entfernt …');
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));
  const u=URL.createObjectURL(blob);
  let image;try{image=await S.T.RawImage.fromURL(u);}finally{URL.revokeObjectURL(u);}
  const {pixel_values}=await S.processor(image);
  const {output}=await S.model({input:pixel_values});
  const mask=await S.T.RawImage.fromTensor(output[0].mul(255).to('uint8')).resize(c.width,c.height);
  const w=c.width,h=c.height,x=c.getContext('2d'),id=x.getImageData(0,0,w,h),d=id.data;
  let x0=w,y0=h,x1=0,y1=0;
  for(let k=0;k<w*h;k++){const a=mask.data[k];d[k*4+3]=a;if(a>40){const px=k%w,py=(k/w)|0;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;}}
  if(x1<=x0||y1<=y0)return null;
  x.putImageData(id,0,0);
  const m=Math.round(Math.max(x1-x0,y1-y0)*.04),sx=Math.max(0,x0-m),sy=Math.max(0,y0-m),sw=Math.min(w,x1+m)-sx,sh=Math.min(h,y1+m)-sy;
  const o=document.createElement('canvas');o.width=sw;o.height=sh;o.getContext('2d').drawImage(c,sx,sy,sw,sh,0,0,sw,sh);
  return o;
}
async function shrink(f,max=720,auto=false){const i=await fileToImg(f);const s=Math.min(1,max/Math.max(i.width,i.height));const w=Math.round(i.width*s),h=Math.round(i.height*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(i,0,0,w,h);const d=x.getImageData(0,0,w,h).data;let cut=false;for(let k=3;k<d.length;k+=16){if(d[k]<250){cut=true;break;}}
  if(auto&&!cut){try{const o=await removeBg(c);if(o)return {url:o.toDataURL('image/png'),cut:true};toast('Kein Motiv erkannt, das Originalfoto bleibt.');}catch(e){console.error(e);toast('Automatische Freistellung nicht möglich, das Originalfoto bleibt.');}}
  return {url:c.toDataURL(cut?'image/png':'image/jpeg',.78),cut};}

/* Anzeige */
const T={items:'Bestand',outfits:'Outfits',week:'Woche'};
const chipRow=(list,act,attr)=>list.map(c=>`<button class="chip${c===act?' on':''}" ${attr}="${c}">${c}</button>`).join('');
function renderWeek(){
  const ds=weekDates(weekStart),today=iso(new Date()),a=weekStart,b=addDays(weekStart,6);
  $('#wTitle').textContent='KW '+kw(weekStart);
  $('#wRange').textContent=`${a.getDate()}. ${a.getMonth()===b.getMonth()?'':MON[a.getMonth()]+' '}bis ${b.getDate()}. ${MON[b.getMonth()]} ${b.getFullYear()}`;
  $('#days').innerHTML=ds.map((d,i)=>{const o=outfits.find(x=>x.id===plan[d]);return `<button class="day${d===today?' today':''}" data-d="${d}"><span class="dl"><b>${WD[i]}</b>${+d.slice(8)}.</span>${o?`<span class="dc"><span class="strip">${sortIds(o.ids).slice(0,5).map(x=>thumb(byId(x))).join('')}</span><span class="nm">${esc(o.name)}</span></span>`:'<span class="dc sub">Outfit wählen</span>'}</button>`;}).join('');
}
function render(){
  document.querySelectorAll('main>section').forEach(s=>{s.hidden=s.id!=='v-'+tab;});
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#fab').hidden=tab==='week';
  $('#fab').textContent=tab==='items'?'Teil hinzufügen':'Outfit erstellen';
  $('#title').textContent=T[tab];
  $('#count').textContent=tab==='items'?plural(items.length,'Teil','Teile'):tab==='outfits'?plural(outfits.length,'Outfit','Outfits'):'KW '+kw(weekStart);
  $('#chips').innerHTML=chipRow(['Alle','Favoriten',...CATS],filter,'data-f');
  const list=filter==='Alle'?items:filter==='Favoriten'?items.filter(i=>i.fav):items.filter(i=>i.cat===filter);
  $('#grid').innerHTML=list.length?list.map(i=>`<button class="card" data-id="${i.id}">${star(i)}${thumb(i)}<span class="nm">${esc(i.name)}</span><span class="sub">${esc(i.color)}</span></button>`).join(''):`<p class="empty">${items.length?'In dieser Kategorie ist noch nichts.':'Dein Bestand ist noch leer. Tippe auf „Teil hinzufügen“ und fotografiere dein erstes Kleidungsstück.'}</p>`;
  $('#ochips').innerHTML=chipRow(['Alle','Favoriten',...OCATS],ofilter,'data-c');
  const ol=ofilter==='Alle'?outfits:ofilter==='Favoriten'?outfits.filter(o=>o.fav):outfits.filter(o=>o.cat===ofilter);
  $('#ogrid').innerHTML=ol.length?ol.map(o=>`<button class="card" data-o="${o.id}">${star(o)}${collage(o.ids)}<span class="nm">${esc(o.name)}</span><span class="sub">${o.cat?esc(o.cat)+', ':''}${plural(o.ids.filter(byId).length,'Teil','Teile')}</span></button>`).join(''):`<p class="empty">${outfits.length?'In dieser Kategorie ist noch kein Outfit.':items.length?'Noch keine Outfits. Wähle mehrere Teile aus deinem Bestand und speichere sie als Outfit.':'Lege zuerst ein paar Teile im Bestand an, dann kannst du sie hier zu Outfits kombinieren.'}</p>`;
  renderWeek();
}

/* Bestand: Teil anlegen und bearbeiten */
function showPhoto(){const p=$('#photoPrev');if(photo){p.src=photo;}else{p.removeAttribute('src');}p.hidden=!photo;$('#photoHint').hidden=!!photo;}
function openItem(id){
  cur=id?items.find(i=>i.id===id):null;photo=cur?cur.img:null;photoCut=cur?!!cur.cut:false;
  $('#itTitle').textContent=cur?'Teil bearbeiten':'Neues Teil';
  $('#itName').value=cur?cur.name:'';
  $('#itCat').value=cur?cur.cat:(filter!=='Alle'?filter:CATS[0]);
  $('#itColor').value=cur?cur.color:COLORS[0];
  $('#itDel').hidden=!cur;showPhoto();$('#itemDlg').showModal();
}
$('#photoIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;busy=true;setBusy('Foto wird verarbeitet …');try{const r=await shrink(f,720,$('#autoCut').checked);photo=r.url;photoCut=r.cut;showPhoto();}catch(err){toast('Das Foto konnte nicht geladen werden.');}busy=false;setBusy('');};
$('#itSave').onclick=async()=>{
  if(busy){toast('Das Foto wird noch bearbeitet, kurz warten.');return;}
  const name=$('#itName').value.trim();
  if(!name){toast('Gib dem Teil einen Namen.');$('#itName').focus();return;}
  const it={id:cur?cur.id:uid(),name,cat:$('#itCat').value,color:$('#itColor').value,img:photo,cut:photoCut,fav:cur?!!cur.fav:false,created:cur?cur.created:Date.now()};
  if(!await save('items',it))return;
  if(cur)Object.assign(cur,it);else items.unshift(it);
  $('#itemDlg').close();render();
};
$('#itDel').onclick=async()=>{
  if(!confirm(`„${cur.name}“ löschen? Das Teil wird auch aus allen Outfits entfernt.`))return;
  const id=cur.id;
  try{
    await rm('items',id);items=items.filter(i=>i.id!==id);
    for(const o of [...outfits]){if(!o.ids.includes(id))continue;o.ids=o.ids.filter(x=>x!==id);
      if(o.ids.length){await put('outfits',o);}else{await rm('outfits',o.id);outfits=outfits.filter(x=>x.id!==o.id);}}
  }catch(e){toast('Löschen fehlgeschlagen.');}
  $('#itemDlg').close();render();
};
$('#itCancel').onclick=()=>$('#itemDlg').close();

/* Outfits */
const upd=()=>{$('#ouCol').innerHTML=collage([...sel]);$('#ouCount').textContent=plural(sel.size,'Teil','Teile')+' ausgewählt';};
const catChips=()=>{$('#ouCats').innerHTML=chipRow(OCATS,ocat,'data-c');};
function nextName(c){let m=0;outfits.forEach(o=>{const r=o.name.match(new RegExp('^'+c+' (\\d+)$'));if(r)m=Math.max(m,+r[1]);});return `${c} ${m+1}`;}
async function setPlan(d,id){try{if(id){await put('plan',{date:d,outfitId:id});plan[d]=id;}else{await rm('plan',d);delete plan[d];}return true;}catch(e){toast('Speichern fehlgeschlagen.');return false;}}
function openOutfit(id){
  if(!items.length){toast('Lege zuerst ein paar Teile im Bestand an.');return;}
  curO=id?outfits.find(o=>o.id===id):null;
  sel=new Set(curO?curO.ids.filter(byId):[]);
  ocat=curO&&curO.cat?curO.cat:(ofilter!=='Alle'?ofilter:'Alltag');
  $('#ouTitle').textContent=curO?'Outfit bearbeiten':'Neues Outfit';
  $('#ouName').value=curO?curO.name:'';
  catChips();
  $('#picker').innerHTML=CATS.filter(c=>items.some(i=>i.cat===c)).map(c=>`<h3>${c}</h3><div class="pick">${items.filter(i=>i.cat===c).map(i=>`<button class="pk${sel.has(i.id)?' on':''}" data-id="${i.id}" aria-label="${esc(i.name)}">${thumb(i)}</button>`).join('')}</div>`).join('');
  upd();$('#outfitDlg').showModal();
}
$('#ouCats').onclick=e=>{const b=e.target.closest('[data-c]');if(b){ocat=b.dataset.c;catChips();}};
$('#picker').onclick=e=>{
  const b=e.target.closest('.pk');if(!b)return;
  const id=b.dataset.id,it=byId(id);
  if(sel.has(id))sel.delete(id);
  else{if(ONE.includes(it.cat))[...sel].filter(x=>byId(x).cat===it.cat).forEach(x=>sel.delete(x));sel.add(id);}
  document.querySelectorAll('#picker .pk').forEach(p=>p.classList.toggle('on',sel.has(p.dataset.id)));upd();
};
$('#ouSave').onclick=async()=>{
  if(!sel.size){toast('Wähle mindestens ein Teil aus.');return;}
  let name=$('#ouName').value.trim();
  if(!name||(new RegExp('^('+OCATS.join('|')+') \\d+$').test(name)&&!name.startsWith(ocat+' ')))name=nextName(ocat);
  const o={id:curO?curO.id:uid(),name,cat:ocat,ids:sortIds([...sel]),fav:curO?!!curO.fav:false,created:curO?curO.created:Date.now()};
  if(!await save('outfits',o))return;
  if(curO)Object.assign(curO,o);else outfits.unshift(o);
  $('#outfitDlg').close();render();
};
$('#ouCancel').onclick=()=>$('#outfitDlg').close();

/* Outfit-Übersicht */
function openOv(id){
  curO=outfits.find(o=>o.id===id);if(!curO)return;
  const ids=sortIds(curO.ids);
  $('#ovTitle').textContent=curO.name;
  $('#ovMeta').textContent=(curO.cat?curO.cat+', ':'')+plural(ids.length,'Teil','Teile');
  $('#ovCol').innerHTML=collage(ids);
  $('#ovItems').innerHTML=ids.map(x=>{const i=byId(x);return `<div class="irow">${thumb(i)}<div><div class="nm">${esc(i.name)}</div><div class="sub">${esc(i.cat)}, ${esc(i.color)}</div></div></div>`;}).join('');
  $('#ovWk').textContent='Zur Woche hinzufügen, KW '+kw(weekStart);
  $('#ovDays').innerHTML=weekDates(weekStart).map((d,i)=>`<button class="chip" data-d="${d}">${WD[i]} ${+d.slice(8)}.</button>`).join('');
  $('#ovDlg').showModal();
}
$('#ovDays').onclick=async e=>{const b=e.target.closest('[data-d]');if(!b)return;if(await setPlan(b.dataset.d,curO.id)){render();toast(`Für ${b.textContent} eingetragen.`);}};
$('#ovEdit').onclick=()=>{$('#ovDlg').close();openOutfit(curO.id);};
$('#ovDel').onclick=async()=>{
  if(!confirm(`„${curO.name}“ löschen? Die Teile bleiben im Bestand.`))return;
  const id=curO.id;
  try{await rm('outfits',id);outfits=outfits.filter(o=>o.id!==id);for(const d of Object.keys(plan)){if(plan[d]===id){await rm('plan',d);delete plan[d];}}}
  catch(e){toast('Löschen fehlgeschlagen.');}
  $('#ovDlg').close();render();
};
$('#ovClose').onclick=()=>$('#ovDlg').close();

/* Wochenplaner */
function openDay(d){
  dayD=d;
  $('#dyTitle').textContent=new Date(d+'T12:00:00').toLocaleDateString('de-AT',{weekday:'long',day:'numeric',month:'long'});
  $('#dyList').innerHTML=outfits.length?`<div class="dgrid">${outfits.map(o=>`<button class="card" data-o="${o.id}">${collage(o.ids)}<span class="nm">${esc(o.name)}</span></button>`).join('')}</div>`:'<p class="meta">Du hast noch keine Outfits. Erstelle zuerst eines im Tab „Outfits“.</p>';
  $('#dyClear').hidden=!plan[d];
  $('#dayDlg').showModal();
}
$('#dyList').onclick=async e=>{const b=e.target.closest('[data-o]');if(b&&await setPlan(dayD,b.dataset.o)){$('#dayDlg').close();render();}};
$('#dyClear').onclick=async()=>{if(await setPlan(dayD,null)){$('#dayDlg').close();render();}};
$('#dyClose').onclick=()=>$('#dayDlg').close();

/* Backup */
async function exportData(){
  const f=new File([JSON.stringify({v:2,items,outfits,plan:Object.entries(plan).map(([date,outfitId])=>({date,outfitId}))})],`schrank-backup-${new Date().toISOString().slice(0,10)}.json`,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});backed();return;}catch(e){if(e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();backed();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
$('#exp').onclick=exportData;
$('#impIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.items)||!Array.isArray(d.outfits))throw new Error('format');
    for(const i of d.items)await put('items',i);
    for(const o of d.outfits)await put('outfits',o);
    for(const p of d.plan||[])await put('plan',p);
    await loadAll();render();
    $('#bkDlg').close();toast(`${plural(d.items.length,'Teil','Teile')} und ${plural(d.outfits.length,'Outfit','Outfits')} importiert.`);
  }catch(err){toast('Diese Datei ist kein gültiges Backup.');}
};
const backed=()=>{ls.set('backup',String(Date.now()));checkBackup();};
function checkBackup(){
  const now=Date.now();
  if(!ls.get('first'))ls.set('first',String(now));
  const last=+(ls.get('backup')||ls.get('first')),snooze=+(ls.get('snooze')||0);
  const due=(items.length||outfits.length)&&now-last>14*864e5&&now>snooze;
  $('#bkBanner').hidden=!due;
  if(due)$('#bkTxt').textContent=ls.get('backup')?`Deine letzte Sicherung ist ${Math.floor((now-last)/864e5)} Tage alt.`:'Du hast noch keine Sicherung gemacht.';
}
function openBk(){const b=ls.get('backup');$('#bkInfo').textContent=b?'Letzte Sicherung: '+new Date(+b).toLocaleDateString('de-AT',{day:'numeric',month:'long',year:'numeric'}):'Noch keine Sicherung gemacht.';$('#bkDlg').showModal();}
$('#bkBtn').onclick=openBk;
$('#bkNow').onclick=openBk;
$('#bkLater').onclick=()=>{ls.set('snooze',String(Date.now()+3*864e5));checkBackup();};
$('#bkClose').onclick=()=>$('#bkDlg').close();

/* Start */
async function loadAll(){items=await all('items');outfits=await all('outfits');plan={};(await all('plan')).forEach(p=>{plan[p.date]=p.outfitId;});sortAll();}
$('#itCat').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
$('#itColor').innerHTML=COLORS.map(c=>`<option>${c}</option>`).join('');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();window.scrollTo(0,0);});
$('#fab').onclick=()=>tab==='items'?openItem():openOutfit();
$('#chips').onclick=e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render();}};
$('#ochips').onclick=e=>{const b=e.target.closest('[data-c]');if(b){ofilter=b.dataset.c;render();}};
$('#grid').onclick=e=>{const s=e.target.closest('[data-fav]');if(s){toggleFav('items',s.dataset.fav);return;}const b=e.target.closest('[data-id]');if(b)openItem(b.dataset.id);};
async function toggleFav(store,id){const o=(store==='items'?items:outfits).find(x=>x.id===id);if(!o)return;const n={...o,fav:!o.fav};if(await save(store,n)){o.fav=n.fav;render();}}
$('#ogrid').onclick=e=>{const s=e.target.closest('[data-fav]');if(s){toggleFav('outfits',s.dataset.fav);return;}const b=e.target.closest('[data-o]');if(b)openOv(b.dataset.o);};
$('#days').onclick=e=>{const b=e.target.closest('[data-d]');if(b)openDay(b.dataset.d);};
$('#wPrev').onclick=()=>{weekStart=addDays(weekStart,-7);render();};
$('#wNext').onclick=()=>{weekStart=addDays(weekStart,7);render();};
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close();}));
(async()=>{
  try{db=await openDb();await loadAll();}
  catch(e){toast('Speicher nicht verfügbar. Im privaten Modus funktioniert das nicht.');}
  render();checkBackup();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
})();

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
